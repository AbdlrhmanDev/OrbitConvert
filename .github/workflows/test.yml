name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  test:
    name: Unit and integration tests
    runs-on: windows-latest
    env:
      # Tools are fetched by OrbitConvert's own checksum-verified installer into this folder,
      # and the integration tests discover them here.
      ORBITCONVERT_DATA: ${{ github.workspace }}\.ci-data
      ORBITCONVERT_TOOLS_DIR: ${{ github.workspace }}\.ci-data\tools
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build OrbitConvert.sln -c Release

      - name: Cache conversion tools
        uses: actions/cache@v6
        with:
          path: .ci-data/tools
          key: tools-${{ hashFiles('src/OrbitConvert.Infrastructure/Tools/DependencyInstaller.cs') }}

      - name: Install FFmpeg, Pandoc and 7-Zip (pinned, SHA-256 verified)
        shell: pwsh
        run: |
          $cli = "src/OrbitConvert.Cli/bin/Release/net10.0/orbitconvert-cli.exe"
          foreach ($tool in "ffmpeg", "pandoc", "7zip") {
            & $cli install-tool $tool --yes
            if ($LASTEXITCODE -ne 0) { throw "install-tool $tool failed" }
          }
          & $cli tools

      - name: Test
        run: >
          dotnet test OrbitConvert.sln -c Release --no-build
          --logger "trx;LogFilePrefix=results"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.sha }}
          path: TestResults/*.trx
          retention-days: 14

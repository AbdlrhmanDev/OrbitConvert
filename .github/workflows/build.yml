name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build, publish and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (Release, warnings shown)
        run: dotnet build OrbitConvert.sln -c Release

      - name: Package (self-contained publish, portable ZIP, MSI, checksums)
        shell: pwsh
        run: ./scripts/build-release.ps1 -SkipTests

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: orbitconvert-packages-${{ github.sha }}
          path: artifacts/release/*
          retention-days: 14
